_comment: 扩展监控线定义（生成自 data/raw/expansion_research.json；改白话文案可直接编辑本文件）
lines:
- id: line.credit
  name: 信用利差引信
  prefix: credit.
  thesis: 前提：这轮AI扩建靠借债。信号：最差CCC类利差先走阔、高收益债相对国债先跌而股指还在高位——信用裂缝比股票大跌早1-3个月。标的：盯HYG/LQD比价，触发就先减AI高杠杆持仓。失效：HY利差回到3.5%下且比价收复200日线。
  link: AI 主线刹车支线 + 独立信用周期线
  batch: 1
- id: line.usdebt
  name: 美债利息雪球
  prefix: usdebt.
  thesis: 前提：美债40万亿，利息涨得比经济快就进复利螺旋。信号：拍卖认购变弱、一级交易商被迫接盘、赤字不收敛、上限余量耗尽。标的：金+短债替长债，警报叠加时减成长股。失效：利息增速回落到名义GDP下且拍卖连续4场健康。
  link: 新主线（财政不可持续→贬值交易）
  batch: 1
- id: line.carry
  name: 日元套息引信
  prefix: carry.
  thesis: 前提：全球风险资产借便宜日元加杠杆。信号：日债利率上台阶+日元空头极端拥挤后急回补=平仓开始，BTC、纳指、韩股同日挨打（2024-08剧本）。标的：FXY对冲、日本银行股受益，全站挂减杠杆提示。失效：净头寸回中性且日元波动平息。
  link: 新主线，兼给加密/AI主线装外生冲击预警器
  batch: 1
- id: line.power
  name: 数据中心电力缺口
  prefix: power.
  thesis: 前提：AI用电增速远超电网扩建。信号：工业电价同比走高、核电出力收紧、发电商跑赢大盘=缺电确认。标的：CEG/VST/GEV等发电燃机。反向用法：电力股叙事先崩是AI顶部先兆。失效：电价同比转负且CEG/VST双破200日线。
  link: AI 主线支线（机会+上游成本预警双向）
  batch: 1
- id: line.grid
  name: 电网设备十年短缺
  prefix: grid.
  thesis: 前提：电网换代+AI接入叠加，大变压器交货3-5年，设备商在手订单能见度全市场最高。信号：官方未交付订单创新高=短缺持续；新订单转负=见顶预警。标的：GEV/ETN/思源等，订单仍新高时龙头深跌=错杀买点。失效：未交付订单同比转负且龙头跑输大盘。
  link: 新主线（用户本行，可用行业知识交叉验证）
  batch: 1
- id: line.dedollar
  name: 货币换锚与央行买金
  prefix: dedollar.
  thesis: 前提：历史上换锚前10-15年央行先囤中性资产。信号：金价不理会利率（负相关失效）、美元储备份额跌向55%、官方美债持仓换成杠杆快钱、Fed托管流出。标的：金银铂+BTC，白银是扩散段主力。失效：金价与实际利率恢复负相关半年或份额回58%上。
  link: 新主线（历史周期线）
  batch: 2
- id: line.repression
  name: 金融抑制前兆
  prefix: repression.
  thesis: 前提：大债务从不还清，是把实际利率压在通胀下温水煮掉，储蓄者买单。信号：实际利率压负+CPI仍高、回购尖峰频发、圈买家限流出的制度动作见报。标的：金、商品、TIP、BTC、非美市场；减长债与美元现金。失效：实际利率回+1.5%且无管制立法。
  link: 新主线（与 line.usdebt 互为出口：债务的第三条路）
  batch: 2
- id: line.volveto
  name: 惊吓/危机分辨器
  prefix: vol.
  thesis: 前提：VIX>30不都是买点——2008/2020证明期限倒挂且持续时是真危机，抄底会抄在半山腰。信号：VIX/VIX3M>1持续3日=否决抄底保存弹药；VIX高但不倒挂=脉冲可抄。标的：无独立标的，是SPX/NDX/BTC的仓位开关。失效：数据源断供则降级为VIX单值。
  link: 全站规则纠错层（给现有 war.vix.30 等抄底规则装否决器）
  batch: 1
- id: line.aibrake
  name: AI 装机泡沫刹车
  prefix: aibrake.
  thesis: 前提：每次技术革命装机期都被金融资本推成泡沫，顶部三特征：改借债扩建、指数集中度极端、电力被挤兑。信号：四大云厂capex减速+CRWV金丝雀腰斩+集中度先坏。标的：触发即减QQQ/SMH/NVDA等，崩后买幸存者。失效：capex再加速且盈利追上价格。
  link: AI 主线刹车支线（那条讲机会，这条给全站唯一的系统性刹车）
  batch: 2
- id: line.copperwar
  name: 铜金比战争经济判别器
  prefix: copperwar.
  thesis: 前提：军费、关税、赤字都在推通胀，但分两种剧本。信号：铜金同涨=有实物需求的战争经济，商品全面配；金独涨铜不动=纯恐惧只配贵金属。铜=吃饭的金属，金=害怕的金属。失效：铜金比破位且通胀预期<2.2%，转通缩剧本。
  link: 地缘主线支线（1970年代滞胀剧本判别）
  batch: 1
- id: line.thaidc
  name: 泰国 EEC 数据中心走廊
  prefix: thaidc.
  thesis: 前提：新加坡限电限地，数据中心沿柔佛→泰国EEC转移，谷歌AWS微软字节已官宣。信号：泰达电新高=AI电源订单兑现；Gulf等电力股上200日线=扩散到PPA侧。标的：DELTA/GULF等.BK+泰铢。你在现场干电力工程可人工校验。失效：项目取消或龙头双破200日线。
  link: AI 主线区域支线（用户信息优势主场）
  batch: 1
- id: line.decouple
  name: 科技脱钩双向盘
  prefix: decouple.
  thesis: 前提：中美脱钩以规则流推进，联邦公报可每日机读计数。信号：实体清单密集=升级期，利多稀土与国产设备、利空中概美设备；移除为主=缓和反做。2026-11稀土停火到期是写在日历上的引信。失效：达成回滚协议且移除类文档成批出现。
  link: 地缘主线支线 + AI 主线交叉（管制升级利多稀土国产设备、利空中概美设备）
  batch: 2
- id: line.emfood
  name: 泰铢与新兴市场危机网
  prefix: emfood.
  thesis: 前提：美元高利率周期总引爆1-2个新兴市场，1997起点就是泰铢；你人在泰国资产在泰国。信号：EM主权债利差代理走阔+亚币齐贬+油价破百=危机组合；大米糖大涨=泰国出口加分、进口国点火。失效：美联储降息且利差收复200日线。
  link: 新主线（用户主场风险网，含粮价引线）
  batch: 2
- id: line.liquidity
  name: 美元流动性管道
  prefix: liq.
  thesis: 前提：准备金见底先在货币市场管道露头。信号：RRP归零后SOFR相对EFFR抬升、回购尖峰，随后美联储被迫停缩表转宽松——BTC黄金的领先买点（2019剧本）。标的：SOMA拐点确认后加仓BTC/金。失效：SRF平抑利差、QT平稳走完。
  link: 加密主线支线（BTC/金的领先买点）
  batch: 2
- id: line.uranium
  name: 核能复兴与铀
  prefix: uranium.
  thesis: 前提：AI缺电+政策转向，核电从夕阳变战略资产，铀供给刚性、公用事业补库。信号：铀价站上100美元=新周期；NRC在运机组增加=政策落地硬证据。标的：CCJ/URA/实物信托打底，SMR当高波动期权。失效：铀价破65且机组数不增。
  link: AI 主线支线（电力缺口的政策级解法）
  batch: 2
- id: line.china
  name: 中国政策周期反转
  prefix: china.
  thesis: 前提：通缩地产逼北京持续宽松，人民币资产折价修复可能已到中段。信号：人民币趋势+恒科新高=续航；铁矿铜实物验证；地产幸存者相对强弱=出清见底前兆。标的：KWEB/3067.HK/1109.HK等。失效：人民币回7.2、恒指破位且商品同下。
  link: 新主线（地缘主线的对侧：刺激温度计）
  batch: 2
- id: line.defense
  name: 军费超级周期与金穹
  prefix: defense.
  thesis: 前提：欧洲再武装+美国金穹共用一个引擎=政府订单，且欧洲罕见出现宽货币+宽财政共振。信号：国防部拨款同比>10%=采购加速；金穹合同新闻=事件；HICP反弹则共振失效。标的：AVAV/SHLD/EUAD/LHX加已有军工。失效：持续停火+预算下修或拨款转负。
  link: 地缘主线支线（订单流硬数据补强）
  batch: 2
- id: line.space
  name: 商业航天双子星
  prefix: space.
  thesis: 前提：可复用火箭把发射成本压到千美元/公斤级，三大星座抢跑而发射运力十年紧缺。信号：在轨卫星数免费日更比财报早——ASTS组网节奏、Kuiper掉队与否、Neutron首飞二元事件。标的：RKLB/ASTS小仓。失效：Neutron拖到2027中且全球发射量转负。
  link: 新主线（未来技术路线）
  batch: 2
- id: line.catastrophe
  name: 巨灾雷达
  prefix: cat.
  thesis: 前提：巨灾与金融周期零相关，却直通主线：台日大地震=芯片供应链尾部，美湾大飓风=天然气冲击。信号：USGS/NHC实时免费。标的：再保股大灾后先跌后因费率硬化走强，灾后30-60天是逆向买点；泰国周边地震核查SET。失效：纯事件触发器，只查数据源可用性。
  link: 地缘/AI 主线的非金融尾部（台日地震=芯片供应链冲击）+ 独立逆向线
  batch: 2
- id: line.frontier
  name: 前沿科研拐点雷达
  prefix: frontier.
  thesis: 前提：技术拐点在股价前6-18个月先出现在论文→模型→代码三级免费计数里。信号：量子纠错论文加速、前沿模型算力斜率下折（直接检验AI主线核心假设）、开源模型下载增速。标的：QTUM小仓+给AI主线做确认/反转。失效：某支线论文同比转负两季则移出。
  link: AI 主线的假设检验层 + 未来技术路线孵化器
  batch: 2
