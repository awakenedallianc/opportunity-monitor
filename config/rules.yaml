# 规则：把三篇报告的入场条件 / 失效信号 / 触发日历 / 敏感话题变成可机读条件。
# level: opportunity（机会）| warning（风险）| invalidation（失效）| event（事件/日历）| info（信息）
# priority: 1 最高 … 5 最低
rules:
  # ======================= 加密（《加密三年测评图鉴》六、监控指标） =======================
  - id: crypto.btc.entry_a
    plain: 比特币重新站上中期趋势线，报告说可以开始分批买
    report: crypto
    title: BTC 周线收于 50 周均线之上
    level: opportunity
    priority: 1
    assets: [BTC]
    action: 深跌情景失效，加快核心建仓（BTC 入场条件 a）
    source: 六、监控指标｜宏观：BTC周线 vs 50周均线（约$81K）收于其上
    when: {type: compare, metric: crypto.btc.weekly_close, op: gt, ref_metric: crypto.btc.wma50, label: BTC周收盘, ref_label: 50周均线}
  - id: crypto.btc.entry_b_zone
    plain: 比特币跌到报告说的"便宜区"（5.4–6.4 万美元）
    report: crypto
    title: BTC 进入 $54K–64K 实现价格区间
    level: opportunity
    priority: 1
    assets: [BTC]
    action: 若同时出现 ETF 连续净流入 → 分批建仓（BTC 入场条件 b）；本规则仅判断价格区间
    source: 逐标的测评｜BTC 我的判断（b）
    when: {type: compare, metric: px.BTC, op: between, value: [54000, 64000], label: BTC}
  - id: crypto.btc.entry_b
    plain: 便宜区 + 资金持续流入，报告说的买入条件齐了
    report: crypto
    title: BTC 在 $54K–64K 区间且 ETF 连续净流入 ≥5 个交易日
    level: opportunity
    priority: 1
    assets: [BTC]
    action: 分批建仓（BTC 入场条件 b 的完整版）
    source: 逐标的测评｜BTC 我的判断（b）
    when:
      all:
        - {type: compare, metric: px.BTC, op: between, value: [54000, 64000], label: BTC}
        - {type: compare, metric: etf.btc.streak_days, op: gte, value: 5, label: ETF连续净流入天数}
  - id: crypto.etf.outflow_2m
    plain: 大资金连续两个月在撤出比特币基金，报告说要减仓
    report: crypto
    title: BTC ETF 近约两个月（42 个交易日）净流出超 $30 亿
    level: warning
    priority: 1
    assets: [BTC, ALL]
    action: 降低整体加密敞口（报告：连续两月净流出 >$30 亿）
    source: 六、监控指标｜BTC ETF月度净流
    when:
      all:
        - {type: compare, metric: etf.btc.flow_60d, op: lt, value: -3000000000, label: ETF 60日净流}
        - {type: compare, metric: etf.btc.flow_30d, op: lt, value: 0, label: ETF 30日净流}
  - id: crypto.etf.inflow_streak
    plain: 大资金连续一周在买入比特币基金
    report: crypto
    title: BTC ETF 连续净流入 ≥7 个交易日
    level: info
    priority: 3
    assets: [BTC]
    action: 需求通道打开；与价格区间条件配合判断
    source: 逐标的测评｜BTC 多头逻辑
    when: {type: compare, metric: etf.btc.streak_days, op: gte, value: 7, label: ETF连续净流入天数}
  - id: crypto.btc.below_realized
    plain: 比特币跌破了持有者的平均成本，离报告的"失效线"很近
    report: crypto
    title: BTC 现价跌破实现价格（Coin Metrics 推算）
    level: warning
    priority: 1
    assets: [BTC]
    action: 逼近整体失效条件 (1)：月线收盘若也低于 $53.6K 则周期深度模板恢复
    source: 六、监控指标｜BTC月线 vs 实现价格
    when: {type: compare, metric: px.BTC, op: lt, ref_metric: crypto.btc.realized_price, label: BTC, ref_label: 实现价格}
  - id: crypto.eth.inflation
    plain: 以太坊每年多印的币超过 1%，报告说这是坏信号
    report: crypto
    title: ETH 年化净增发 >1%
    level: invalidation
    priority: 2
    assets: [ETH]
    action: ETH 失效信号（净通胀升破 1%/年且持续两季）
    source: 逐标的测评｜ETH 失效信号
    when: {type: compare, metric: eth.supply_growth_yearly_pct, op: gt, value: 1.0, label: ETH年化供给增长%}
  - id: crypto.altseason.75
    plain: 小币种集体暴涨，报告说该给卫星仓位止盈了
    report: crypto
    title: 山寨季指数 >75
    level: warning
    priority: 2
    action: 卫星仓位止盈规则启动
    source: 六、监控指标｜Altcoin Season Index >75
    when: {type: compare, metric: crypto.altseason, op: gt, value: 75, label: 山寨季指数}
  - id: crypto.funding.hot
    plain: 借钱做多的人太多，容易被一次急跌清算
    report: crypto
    title: BTC 永续资金费率 >0.05%/8h（杠杆过热）
    level: warning
    priority: 3
    assets: [BTC]
    action: 冲击日高贝塔清算风险；不追高
    source: 05 天然实验｜比特币（战争报告）
    when: {type: compare, metric: funding.BTC, op: gt, value: 0.05, label: BTC资金费率%}
  - id: crypto.btc.invalidation
    plain: 比特币月线跌破 5.36 万美元，报告的整套判断失效
    report: crypto
    title: BTC 月线跌破 $53.6K 实现价格
    level: invalidation
    priority: 1
    assets: [BTC, ALL]
    action: 周期深度模板恢复，暂停卫星与期权仓位；整体失效条件 (1)
    source: 六、监控指标｜BTC月线 vs 实现价格（约$53.6K）跌破
    when: {type: compare, metric: crypto.btc.monthly_close, op: lt, value: 53600, label: BTC月收盘}
  - id: crypto.btc.below_200wma
    plain: 比特币跌破长期趋势线，"浅回撤"的说法站不住了
    report: crypto
    title: BTC 跌破 200 周均线
    level: warning
    priority: 2
    assets: [BTC]
    action: 6 月低点曾守住 200 周均线（约$61.7K）；跌破意味着"浅回撤"论据削弱
    source: 二、宏观与周期背景
    when: {type: compare, metric: px.BTC, op: lt, ref_metric: crypto.btc.wma200, label: BTC, ref_label: 200周均线}
  - id: crypto.btc.no_chase
    plain: 比特币在 7.5–8.1 万美元之间，报告说别在这里追
    report: crypto
    title: BTC 处于 $75–81K "不追高"区间
    level: info
    priority: 4
    assets: [BTC]
    action: 报告：不在 $75–81K 区间追高；等待条件 a 或 b
    source: 逐标的测评｜BTC 我的判断
    when: {type: compare, metric: px.BTC, op: between, value: [75000, 81000], label: BTC}
  - id: crypto.eth.entry
    plain: 以太坊相对比特币跌到报告说的加仓区
    report: crypto
    title: ETH/BTC 回到 0.028–0.030 区间
    level: opportunity
    priority: 2
    assets: [ETH]
    action: 若同时出现 ETF 连续净流入 → 加仓 ETH
    source: 六、监控指标｜ETH/BTC 0.028–0.030 加仓
    when: {type: compare, metric: crypto.ethbtc, op: between, value: [0.028, 0.030], label: ETH/BTC}
  - id: crypto.eth.invalidation
    plain: 以太坊相对比特币跌破 0.025，报告说放弃
    report: crypto
    title: ETH/BTC 跌破 0.025
    level: invalidation
    priority: 2
    assets: [ETH]
    action: ETH 失效信号
    source: 六、监控指标｜ETH/BTC <0.025失效
    when: {type: compare, metric: crypto.ethbtc, op: lt, value: 0.025, label: ETH/BTC}
  - id: crypto.sol.low_zone
    plain: Solana 相对比特币处在历史低位
    report: crypto
    title: SOL/BTC 低于 0.0011 历史低位区
    level: opportunity
    priority: 3
    assets: [SOL]
    action: 卫星仓位候选；还需 SIMD-0550 通过或 Alpenglow 激活且月度 REV 连续两月回升
    source: 逐标的测评｜SOL 我的判断
    when: {type: compare, metric: crypto.solbtc, op: lt, value: 0.0011, label: SOL/BTC}
  - id: crypto.sol.rev_up
    plain: Solana 链上收入在回升
    report: crypto
    title: Solana 链收入 30 日滚动较 60 天前回升
    level: opportunity
    priority: 3
    assets: [SOL]
    action: 对应"SOL 月度 REV 连续两月环比增长 → 卫星加仓"（DefiLlama 链收入近似）
    source: 六、监控指标｜SOL月度REV 连续两月环比增长
    when: {type: change, metric: chainrev30d.solana, lookback: 60, op: gt, value: 0, label: SOL链收入30日}
  - id: crypto.hype.revenue_turn
    plain: Hyperliquid 的手续费收入止跌回升
    report: crypto
    title: HYPE 30 日手续费较 90 天前回升（季度环比转正近似）
    level: opportunity
    priority: 2
    assets: [HYPE]
    action: 卫星加仓；连续四季下滑则减仓（另需解锁后 30 天交易所流入率 <5%）
    source: 六、监控指标｜HYPE季度总收入 环比转正
    when: {type: change, metric: fees30d.HYPE, lookback: 90, op: gt, value: 0, label: HYPE费用30日}
  - id: crypto.hype.buyback_yield_low
    plain: Hyperliquid 回购力度不够了，报告说放弃
    report: crypto
    title: HYPE 年化回购/市值跌破 3%
    level: invalidation
    priority: 2
    assets: [HYPE]
    action: HYPE 失效信号
    source: 逐标的测评｜HYPE 失效信号：AF回购/市值年化跌破3%
    when: {type: compare, metric: crypto.hype.buyback_yield, op: lt, value: 3, label: HYPE回购收益率%}
  - id: crypto.aave.revenue_up
    plain: Aave 的收入在增长
    report: crypto
    title: AAVE 30 日收入较 90 天前增长
    level: opportunity
    priority: 3
    assets: [AAVE]
    action: 对应"AAVE 季度净收入转正 → 核心加仓"（DefiLlama 收入近似，非 DAO 净收入）
    source: 六、监控指标｜AAVE季度净收入（DAO口径）转正
    when: {type: change, metric: rev30d.AAVE, lookback: 90, op: gt, value: 0, label: AAVE收入30日}
  - id: crypto.aave.cheap
    plain: Aave 按收入算已经便宜（市值不到年收入 12 倍）
    report: crypto
    title: AAVE 市值/年化收入 <12x
    level: opportunity
    priority: 3
    assets: [AAVE]
    action: 报告：市值/DAO 口径收入低于 12x 时加仓
    source: 逐标的测评｜AAVE 我的判断
    when: {type: compare, metric: ps.AAVE, op: lt, value: 12, label: AAVE P/S}
  - id: crypto.uni.cheap
    report: crypto
    title: UNI 市值/年化协议收入回落至 25x 以下
    level: opportunity
    priority: 4
    assets: [UNI]
    action: 作为卫星买入的前提
    source: 逐标的测评｜UNI 我的判断
    when: {type: compare, metric: ps.UNI, op: lt, value: 25, label: UNI P/S}
  - id: crypto.ena.usde_trigger
    plain: USDe 规模突破 75 亿，开始给持币人分钱
    report: crypto
    title: USDe 供给突破 $75 亿（费用开关触发）
    level: opportunity
    priority: 2
    assets: [ENA]
    action: 触发 5%→20% 阶梯回购；期权仓位条件之一
    source: 六、监控指标｜ENA USDe供给 >$75亿触发回购
    when: {type: compare, metric: stable.USDe, op: gt, value: 7500000000, label: USDe供给}
  - id: crypto.ena.usde_fail
    plain: USDe 规模跌破 40 亿，报告说放弃
    report: crypto
    title: USDe 供给跌破 $40 亿
    level: invalidation
    priority: 2
    assets: [ENA]
    action: ENA 失效
    source: 六、监控指标｜ENA USDe供给 <$40亿失效
    when: {type: compare, metric: stable.USDe, op: lt, value: 4000000000, label: USDe供给}
  - id: crypto.stable.contraction
    plain: 稳定币总量在缩水，市场里的钱在减少
    report: crypto
    title: 稳定币总量 30 天收缩 >3%
    level: warning
    priority: 3
    assets: [ETH, TRX, ENA]
    action: 流动性收缩信号；AI 报告：2026 年稳定币出现四年来首次收缩
    source: 二、宏观｜稳定币结构性数据
    when: {type: change, metric: stable.total, lookback: 30, op: lt, value: -3, label: 稳定币总量}
  - id: crypto.stable.growth
    plain: 稳定币总量明显增长，市场里的钱在增加
    report: crypto
    title: 稳定币总量 90 天增长 >10%
    level: opportunity
    priority: 3
    assets: [ETH, TRX]
    action: 托管链（ETH/TRX）需求通道改善
    source: 二、宏观｜稳定币
    when: {type: change, metric: stable.total, lookback: 90, op: gt, value: 10, label: 稳定币总量}
  - id: crypto.fng.extreme_fear
    plain: 市场极度恐慌，往往接近底部
    report: crypto
    title: 恐惧贪婪指数 <20（极度恐惧）
    level: opportunity
    priority: 3
    action: “入场按条件而非价格”，但极端情绪常与周期低点重合；核对 200 周均线与 ETF 流向
    source: 二、宏观与周期
    when: {type: compare, metric: crypto.fng, op: lt, value: 20, label: 恐惧贪婪}
  - id: crypto.fng.extreme_greed
    plain: 市场极度贪婪，别追高
    report: crypto
    title: 恐惧贪婪指数 >80（极度贪婪）
    level: warning
    priority: 3
    action: 不追高；检查山寨季指数与杠杆
    source: 二、宏观与周期
    when: {type: compare, metric: crypto.fng, op: gt, value: 80, label: 恐惧贪婪}
  - id: crypto.btc.dominance_break
    report: crypto
    title: BTC 主导率跌破 55%
    level: info
    priority: 4
    action: 山寨轮动信号（报告：主导率 58–60%，山寨季指数约 30–35，>75 触发卫星止盈）
    source: 二、宏观｜结构性数据
    when: {type: compare, metric: crypto.btc_dominance, op: lt, value: 55, label: BTC主导率}
  - id: crypto.btc.deep_drawdown
    plain: 比特币比高点跌了六成，接近历史大熊市的深度
    report: crypto
    title: BTC 较 ATH 回撤超过 60%
    level: warning
    priority: 2
    assets: [BTC]
    action: 逼近历史 77–87% 熊市模板；NYDIG 情景 $38–39K
    source: 二、宏观｜周期"完整还是断裂"
    when: {type: compare, metric: athdd.BTC, op: lt, value: -60, label: BTC较ATH}
  - id: crypto.tvl.aave_drop
    report: crypto
    title: Aave TVL 30 天下降 >20%
    level: warning
    priority: 3
    assets: [AAVE]
    action: 检查是否再次发生安全事件（Kelp DAO 事件曾令 TVL 从 $264 亿跌至约 $200 亿）
    source: 逐标的测评｜AAVE 空头逻辑
    when: {type: change, metric: tvl.AAVE, lookback: 30, op: lt, value: -20, label: Aave TVL}
  - id: crypto.news.regulation
    plain: 美国加密立法有大动静
    report: crypto
    title: 加密监管/立法话题 24h 内 ≥3 家来源
    level: event
    priority: 3
    action: 核对 CLARITY/GENIUS/SEC/CFTC 进展；2027 年若通过全面收紧 DeFi/稳定币收益的法案 = 整体失效条件 (2)
    source: 六、监控指标｜监管
    when: {type: news, topic: crypto_regulation, window: 24h, min_sources: 3}
  - id: crypto.news.hack
    plain: 出现多起黑客盗币事件
    report: crypto
    title: 黑客/漏洞话题 24h 内 ≥3 家来源
    level: warning
    priority: 3
    action: 检查是否涉及 AAVE/HYPE/MORPHO 等持仓协议（协议级高危漏洞 = AAVE 失效信号）
    source: 逐标的测评｜AAVE 失效信号
    when: {type: news, topic: crypto_hack, window: 24h, min_sources: 3}
  - id: crypto.news.quantum
    report: crypto
    title: 量子风险话题出现多源报道
    level: warning
    priority: 4
    action: 整体失效条件 (3)：2028 年前量子攻击实际演示
    source: 六、监控指标｜整体失效条件
    when: {type: news, topic: quantum, window: 48h, min_sources: 2}
  - id: crypto.news.etf
    report: crypto
    title: ETF 资金流话题 24h 内 ≥3 家来源
    level: info
    priority: 4
    action: 核对是否出现"连续两月净流出 >$30 亿"（降低整体加密敞口）
    source: 六、监控指标｜BTC ETF月度净流
    when: {type: news, topic: btc_etf, window: 24h, min_sources: 3}
  - id: crypto.news.strategy
    plain: 最大的机构买家（Strategy）有动作
    report: crypto
    title: Strategy/财库公司话题多源报道
    level: warning
    priority: 3
    assets: [BTC, ETH]
    action: 检查 Strategy 是否执行 BTC 货币化出售、BitMine 是否停止增持（失效信号）
    source: 逐标的测评｜BTC/ETH 失效信号
    when: {type: news, topic: strategy_mstr, window: 24h, min_sources: 3}
