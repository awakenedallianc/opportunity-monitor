    priority: 1
    assets: [HYG, SPX]
    action: 信用-股票背离：提前减仓，不等股票回撤确认
    source: 扩展·信用利差引信（line.credit）
    when:
      all:
        - {type: change, metric: ratio.hyg_lqd, lookback: 20, op: lt, value: -3, label: HYG/LQD 20日}
        - {type: change, metric: px.SPX, lookback: 20, op: gt, value: -2, label: 标普 20日}
