reports:
  - id: crypto
    title: 加密三年测评图鉴
    file: reports/crypto_3y.html
    date: "2026-09-20"
    window: "2026.09 → 2029.09"
    thesis: >-
      三年周期下，现金流与生存率决定加密赢家。三个必要条件：强制性现金流通道 × 供给压力已释放 × 可计量需求通道，再乘以"活到 2028 减半后"的生存概率。
      宏观：Fed 9/16 加息至 3.75–4.00%、10 年期≈5%、全球流动性 2025Q3 见顶、低谷"最佳猜测"2027；BTC 领先流动性≈3 个月 → 建仓期 2026 末–2027；减半后 12–18 个月 → 模板峰值 2029。
      入场按条件而非价格；2027 是建仓期而非收获期。
  - id: ai
    title: AI时代交融十年推演
    file: reports/ai_10y.html
    date: "2026-09-20"
    window: "2026 → 2036"
    thesis: >-
      三个时代同一套五步机制：内部人股权 → 无估值锚资产 → 卖铲人 → 零售准入时刻 → 崩盘后幸存者。2026-09 ≈ 1999 年秋，Anthropic/OpenAI IPO = 零售准入时刻打开。
      交融的钱流向发行方、交易所股东、债权人、设备商，而非代币持有者。两段式：2026–28 防守 + 实业进攻（EEC 变电站、设备采购），2028–31 清算期买幸存者，2031–36 生产率兑现。
      个人次序：本职业 AI 化 + 实业订单 → 留 2028 年后的弹药 → 小仓位持有已定价瓶颈层；避开代币/永续/杠杆。
  - id: war
    title: 大国战争风险与资产机会推演
    file: reports/war_risk.html
    date: "2026-09-20"
    window: "2026 → 2031"
    thesis: >-
      买中断、卖恐惧。市场对"威胁"与"行为"定价方式不同：威胁推升避险资产但数周内回吐；行为切断供给并通过通胀与利率反噬避险资产本身。
      2026 年伊朗战争的天然实验：只有物理供给被切断的商品与其运力（原油、油轮运费、LNG、尿素、铀长协）保留涨幅；黄金 -25–28%、比特币每个冲击日下跌、军工脉冲回吐。
      当前起点：能源已兑现，避险与军工已错杀，台海零折价。下一轮不对称机会在"尚未定价的情景"（台海对冲、俄–北约东翼、关键矿物）与"错杀的资产"（军工、黄金）。
