- id: L006
  title: 信任来自「完整、正确、当前」，每个数据点带来源与更新时间
  takeaway: 过期或不完整内容让人觉得不可靠；敢链到外部来源是自信的表现；数据来源、更新时间是仪表盘元数据三件套。
  action: app.js 目前 0 处「备用源」、0 处「曼谷」时间戳，降级源（CoinGecko→Binance、FRED→财政部曲线）对用户是静默的。简明模式每个 tile/状态卡/规则行加「09-21 08:00 曼谷 · CoinGecko ↗」；任何源超过 24h 没更新变灰并写「X 源停更 2 天」；降级明写「今天用备用源」；页脚固定「本次构建 X，下次 Y」。
  applies_to: ux
  source_name: Nielsen Norman Group — Trust or Bust；Microsoft HAX Guideline 2
  url: https://www.nngroup.com/articles/communicating-trustworthiness/
  added: '2026-09-21'
