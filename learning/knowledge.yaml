- id: L009
  title: 把推理步骤摊开给用户看：这不是 AI 猜的，是固定规则算的
  takeaway: 显式展示系统的推理步骤（transparency）；LLM 的解释常不忠实，而规则算出的解释可完全可信；局限说明必须配动作。
  action: 每条触发规则旁固定三行白话（用的哪个数据 / 阈值多少 / 今天的值），rules.yaml 每条已有 plain/label/value，纯模板生成；UI 加一句「这不是 AI 猜的，是固定规则算的」作为差异化；局限配动作：「价格延迟约 15 分钟，盘中别据此下单」；证据紧贴断言放，不放页脚。
  applies_to: monitor
  source_name: Nielsen Norman Group — Explainable AI in Chat Interfaces；Anthropic — Building Effective Agents
  url: https://www.nngroup.com/articles/explainable-ai/
  added: '2026-09-21'
  rank: 9
- id: L010
  title: 数字与排版规范：标签并进数值、标题写结论、等宽数字右对齐、行长受控
  takeaway: 能从上下文看懂的数据不加标签；图表标题说结论；去尾零、同列小数位一致；tabular figures；正文行长 50–75 字符。
  action: stripTile「BTC 现价 63,210」→「BTC 6.3万 ▲1.8% 今天」；规则表「距离阈值 4.2%」→「还差 4.2% 触发」；百分比去尾零、同列小数位一致；数值列加 .num 右对齐；ECharts 轴标签 rotate=0 且 textStyle 指定等宽字体；正文块 max-width 34em。注意中文用户用 万/亿 而非 k/m/b。
  applies_to: ux
  source_name: Refactoring UI；Datawrapper — Text in data visualizations；Material 3 — Applying type；Baymard — Line Length
  url: https://refactoringui.com/previews/labels-are-a-last-resort
  added: '2026-09-21'
