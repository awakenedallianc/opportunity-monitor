- id: L008
  title: 讲好处，不讲技术；一开始说清能做什么不能做什么，并有一页「怎么算」
  takeaway: PAIR：Set the right expectations、Explain the benefit not the technology；538 靠公开方法论页建立可信度。
  action: 'app.js 现在 0 处「关于/投资建议/免责」。首屏第一行改成一句好处「每天帮你看三大风险有没有变、要不要动」，「115 条规则/146 源/机读」全部挪到新增 #tab-method「怎么算」（≤300 字：数据从哪来 / 规则怎么判 / 不做什么 / 已知限制含泰国网络 / 报错入口 Issues 预填），并引用 Anthropic 与 O''Reilly 说明「为什么不用大模型」。'
