  title: 评估要当成架构，信任是瓶颈，先定「可接受的错误」
  takeaway: evaluation became architecture, trust became the bottleneck；上线前先定错到什么程度可接受；让用户知道系统多常出错。
  action: store.py 目前无回溯/命中率，但已有约 400 天快照。建「判定回溯表」：opportunity/warning/invalidation（74 条）触发后 7/30 天自动回看是否命中，全规则表加「历史命中率 / 数据新鲜度」两列；连续下滑自动标「待复核」成为学习周期输入；写明可接受错误「误报可以，漏报大事不行」。这是学习循环唯一的量化闭环。
