- id: L007
  title: 留存：回访奖励应是「信息差」而非分数；不做 streak
  takeaway: Duolingo 的 streak 断了会赶走用户；CURR（7 天内回访率）影响最大；留存靠明确的核心动作。
  action: 不做 streak、不做积分。lastVisit 已存在，做首屏第一行「你 3 天没来：期间 2 条新触发、1 条解除、BTC −4.1%」；定义核心动作 =「看完一句话结论 + 点开一条触发」，要求 ≤2 次点击可达，成为每期巡检项；localStorage 记 visits[]。
  applies_to: ux
  source_name: Lenny's Newsletter — How Duolingo reignited user growth；Reforge — Retention Is The Silent Killer
  url: https://www.lennysnewsletter.com/p/how-duolingo-reignited-user-growth
