  title: 红绿不可靠：状态必须有第二编码；柱从 0 起、手机图例放图上
  takeaway: 蓝/橙对色盲最安全；唯一可靠办法是再加形状/符号/直接标注；Material：柱从 0 基线开始、粗体只给 1–2 个关键元素。
