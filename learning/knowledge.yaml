- id: L013
  title: 通用免责声明是背景噪音，不确定要说具体
  takeaway: 一直挂着的「AI 可能出错」没人看；有效的是具体的不确定表达、分档置信度、来源展示、把矛盾当信号亮出来；robotext 防误读。
  action: 不挂全站「仅供参考」，改在具体判定旁写原因（「两个价格源今天差 3%，可信度降为中」）；多源/多规则矛盾时标「今天有矛盾」而不是取平均；判定卡下一句 robotext「来自 115 条里 X 条触发，30 天翻转 N 次，单日变化不代表趋势」；预测市场 tile 加「30% = 10 次约 3 次」；触发行加「触发 ≠ 建议买卖」。
