  action: rulesTableFull 与 watchTable 在 ≤600px 只显示「规则 / 现值 / 还差」，规则名列 position:sticky;left:0（app.css 已有 sticky 用法可复用）；右缘渐隐遮罩提示可横滚；「阈值/报告/首次触发」放进点击展开行；按报告分组用 details 手风琴。
