lessons:
- id: L001
  title: 解释为了看懂，不为了完整；点开再看细节
  takeaway: 默认只给决策相关的一句，好奇的人再逐层点开；渐进披露最多两层，超过两层用户会迷路。
  action: 每个模块默认只显结论+一句原因；层级压成两层：规则表直接内嵌现值/阈值/还差，抽屉只留 1 张图+1 句白话；展开按钮写明下一层是什么（「看 115 条规则的现值」）；加三档视图开关（只看结论/结论+证据/全部），默认最简，记 localStorage；把「默认折叠」写进设计规范。
  applies_to: ux
  source_name: Google PAIR — Explainability + Trust；NN/g — Progressive Disclosure
  url: https://pair.withgoogle.com/guidebook-v2/chapter/explainability-trust/
  added: '2026-09-21'
  rank: 1
- id: L002
  title: 用户只读页面 20–28% 的字
  takeaway: NN/g 眼动数据：平均只读 20% 的字；页面 ≤111 字时才可能读完一半；每多 100 字只多花 4.4 秒。
  action: 字数硬预算：首屏可见文本 ≤111 字、一句话结论 ≤30 字、每张状态卡 ≤40 字、「报告怎么说」≤50 字。renderOverview 是客户端渲染，巡检时用浏览器工具量 innerText；若把结论文案挪到 Python 侧生成，则纯脚本检查，超标写进 PROGRESS.md。
  applies_to: ux
  source_name: Nielsen Norman Group — How Little Do Users Read?
  url: https://www.nngroup.com/articles/how-little-do-users-read/
  added: '2026-09-21'
  rank: 2
- id: L003
  title: 置信度用三档，不要假精确的百分比
  takeaway: 数字置信度要求用户懂概率，多数人不懂；高/中/低配动作提示更好；允许说「不确定」而不是硬凑结论。
  action: 综合判定卡改成高/中/低三档，各配一句动作（可以按报告基线动 / 再等一天 / 别动）；首屏不出现 73.4% 这类数字，数值只在指标抽屉里给；允许输出「数据不足，今天不判定」。
  applies_to: monitor
  source_name: Google PAIR — Explainability + Trust；OpenAI Model Spec
  url: https://pair.withgoogle.com/guidebook-v2/chapter/explainability-trust/
  added: '2026-09-21'
  rank: 3
- id: L004
  title: 空状态三原则：为什么空、什么时候会有、现在能做什么
  takeaway: 容器不留白，一句话说明状态，借机教功能，并给直接的行动入口。
  action: app.js 里 10 处「无数据」+3 处「暂无」统一改三段式：原因（「PortWatch 今天没更新」）+ 何时会有（「通常次日 09:00 曼谷」）+ 动作（「看上次值 ▸」「看替代指标 ▸」）。今日触发为 0 时挂进已有 nearRules：「今天 0 条触发，离阈值最近的是 X，还差 Y%」。
  applies_to: ux
  source_name: Nielsen Norman Group — Designing Empty States in Complex Applications
  url: https://www.nngroup.com/articles/empty-state-interface-design/
  added: '2026-09-21'
  rank: 4
- id: L005
  title: 加载反馈：<1s 什么都别显示；2–10s 用骨架屏；离线也能看昨天结论
  takeaway: 1 秒内加指示器反而扰人；骨架屏要模仿最终版式；预取要尊重 Save-Data。
  action: 修正诊断：站点不 fetch latest.json，而是把全部数据内联进 2.76MB 的 index.html + echarts 1MB，泰国 4G 首屏被拖慢。做法：site.py 只内联核心数据（状态条/判定/触发/一句话结论 <100KB），其余写 latest-full.json 首屏后再取；echarts 延后加载；navigator.connection.saveData
    时热力图退化为表格；图表容器固定高度静态骨架块（不脉冲）；sw.js 让离线也能看昨天结论。
  applies_to: ux
  source_name: Nielsen Norman Group — Skeleton Screens 101；web.dev — Prefetching & precaching
  url: https://www.nngroup.com/articles/skeleton-screens/
