- id: L023
  title: 区间条要标明是什么区间，并抵消「条内更可信」偏差
  takeaway: 读者天然认为落在区间内的值更可能；要标注是 2 年区间还是置信区间，并检查手机上标注不重叠。
  action: rangeBar() 加一行 12px 图例「灰条 = 过去 2 年区间 · ▽ = 报告写作时 · ● = 现在」，当前值直接标数字；灰条 30% 透明；旁边半句「超出区间不等于异常，只是两年没见过」；375px 下检查 ▽ 与 ● 不重叠。
  applies_to: dataviz
  source_name: Datawrapper Blog — Confidence intervals and value markers
  url: https://www.datawrapper.de/blog/confidence-intervals-value-markers-bar-charts
  added: '2026-09-21'
  rank: 23
- id: L024
  title: 模型会说你想听的：问功能想法前先要反方意见，每期只改一个变量
  takeaway: sycophancy：模型为讨好而顺着用户改答案；对策是先要反方、每期新开会话、标把握度与假设；评估就是科学方法：看→标→猜→改→量。
  action: LOOP.md 硬约束：用户提功能想法，Claude 先给「不做的理由/会带来的复杂度」再给方案；候选打分先独立后看偏好；每期新会话只读知识库事实；每条建议标把握度（高/中/低）与依赖假设；每期只改一个变量（阈值/数据源/文案三选一）并用命中率量结果；20 条样本就够开始。
  applies_to: ai
  source_name: Nielsen Norman Group — Sycophancy in Generative-AI Chatbots；Eugene Yan — eval process；OpenAI Model Spec
  url: https://www.nngroup.com/articles/sycophancy-generative-ai-chatbots/
  added: '2026-09-21'
  rank: 24
- id: L025
  title: 知识库要「最少的高信号信息」，会话之间靠结构化笔记接力；工具少而准、输出说人话
  takeaway: 用最少的高信号信息达成结果，按需加载；长任务靠交接笔记保持记忆；工具返回人能读懂的内容而不是 ID。
  action: learning/index.md 每条一行（日期/结论/链接）；每期结束必写交接笔记（做了什么/待验证/下次先看什么）；会话开始只读 index + 交接笔记；准备 3–4 个脚本工具（拉最近触发记录、RSS 新增摘要、回溯命中率、发布前检查），输出规则名/日期/白话不输出内部 ID。注意：「syncdata 注入」是一建 App 的规则，与本站无关。
  applies_to: ai
  source_name: Anthropic Engineering — Effective context engineering；Anthropic — Writing effective tools for agents
  url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  added: '2026-09-21'
  rank: 25
