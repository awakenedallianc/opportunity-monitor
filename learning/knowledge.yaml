- id: L018
  title: 通知与每日摘要：只发有价值的、同一件事不发两次、没变化就静默
  takeaway: Apple HIG：内容简短有信息量；避免为同一件事发多条；用户决定送达时间。
  action: 只有「新触发/解除/阶段翻转/数据源失效」才发，否则当天不发；同一规则连续触发不重复推；模板 = 一句话结论 + ≤3 条变化 + 链接，≤80 字；site.py 构建时生成 docs/feed.xml（Atom）；站内新触发用 bottombar 小圆点不弹窗。修正：GitHub Pages 无法「让用户定时间」，真正可定时的通道是 Actions 后的 ntfy/Telegram/邮件（见
