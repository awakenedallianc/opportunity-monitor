  title: 聚焦、有主张的界面能赢；往老界面里塞新功能会失败
  takeaway: a16z 复盘：赢家是有主张、聚焦的界面；把新体验塞进原有界面没有一个真正突破；专精一件事。
  action: 学习循环硬规则：首页模块上限 6 个，加一必减一；新亮点先做独立入口+一句话说明，观察两周（localStorage 计数）没人点就下线；只做三篇报告的三个主题，不做通用金融看板。这是防「越学越臃肿」的闸门。
