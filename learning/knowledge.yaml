- id: L019
  title: 引用要能一键看到原句，主动提示「哪里可能错」；引用是责任不是装饰
  takeaway: 用户几乎不点引用链接；深链原句才会引发核查。AAAI 2025 实验：哪怕引用是随机的，带引用就显得可信——所以坏引用是欺骗。
  action: 新闻给「原句+发布时间」预览；判定卡加「复核」（跳原始数据源）与「反方证据」（把规则 when 条件取反生成「若 X 跌回 Y 之下此条解除」，不需 LLM）；分层新闻按 feeds.yaml 已有 tier 排序而非时间；每期抽查 10 条引用 + 20 条分层结果，坏链下线；RSS 摄入校验链接可达性。
  applies_to: ux
  source_name: Nielsen Norman Group — AI Chatbots Discourage Error Checking；Ding et al. — Citations and Trust (AAAI 2025)；Anthropic — Multi-agent research system
  url: https://www.nngroup.com/articles/ai-chatbots-discourage-error-checking/
