- id: L015
  title: 反馈：任务完成后再问、按钮不打字、封闭题、按模块统计；每期只问 3 个问题
  takeaway: NN/g：在互动发生处问、一分钟内、封闭题+可选开放题；NPS 说不清原因；错误分析用二元对错归成 <10 类，≤20 条样本就够。
  action: 每张状态卡/触发行底部两个 28px 按钮「看懂了/没看懂」与「对/错」，单击记录存 localStorage；设置里「复制我的反馈」+ GitHub Issues 预填链接；每期 LOOP 第一步读反馈按模块统计，归 <10 类只做第一名；每期只问用户 3 个「讲讲上一次你…」问题写入 user_needs；RSS 摄入加基础断言（feed 为空/日期异常/重复率）。
