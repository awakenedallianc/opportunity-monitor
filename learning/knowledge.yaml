- id: L014
  title: 首次使用：不做前置教程，把帮助放到用到的那一刻
  takeaway: 读过前置教程的人任务成功率并不更高，反而觉得更难；帮助在情境中给；先给价值再要信息，问了偏好就必须用上。
  action: 不做欢迎弹窗。综合判定卡/基线区间条/热力图三处标题旁放 ? 小图标，点开一句白话（≤30 字）+「不再提示」；第二次访问顶部一个可跳过的单选「最关心：加密/AI/战争」，选后必须真的置顶该主线（问了不用会伤信任）。
